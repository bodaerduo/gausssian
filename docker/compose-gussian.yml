services:
  app:
    image: gaussian:deps
    working_dir: /workspace/gaussian/backend
    command: ["bash", "/workspace/gaussian/docker/start.sh"]
    environment:
      GAUSSIAN_PROJECT_ROOT: /workspace/gaussian
      GAUSSIAN_DATA_ROOT: /app/runtime/data
      GAUSSIAN_MAX_WORKERS: ${GAUSSIAN_MAX_WORKERS:-1}
      GAUSSIAN_FRONT_AUTO_BUILD: ${GAUSSIAN_FRONT_AUTO_BUILD:-false}
      NVIDIA_VISIBLE_DEVICES: all
      # Brush uses headless Vulkan; graphics is required even without a display.
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      # Do not let Brush silently select its CPU backend when a discrete GPU is available.
      CUBECL_WGPU_DEFAULT_DEVICE: "${CUBECL_WGPU_DEFAULT_DEVICE:-DiscreteGpu(0)}"
    volumes:
      - ../runtime/colmap-cuda:/usr/local/bin/colmap:ro
      - ../:/workspace/gaussian
      - ../runtime/data:/app/runtime/data
    expose:
      - "4177"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:4178/health >/dev/null && curl -fsS http://127.0.0.1:4177/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
    runtime: nvidia
    restart: unless-stopped

  nginx:
    image: harbor.djicorp.com/es310/public/nginx:1.26.1
    depends_on:
      - app
    ports:
      - "${HTTPS_PORT:-8080}:443"
    volumes:
      - ${GAUSSIAN_TLS_DIR:-../runtime/tls}:/etc/nginx/tls:ro
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  gaussian-data:
