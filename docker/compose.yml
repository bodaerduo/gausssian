services:
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        CUDA_BUILD_IMAGE: ${CUDA_BUILD_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nvidia/cuda:12.4.1-devel-ubuntu22.04}
        CUDA_RUNTIME_IMAGE: ${CUDA_RUNTIME_IMAGE:-swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/nvidia/cuda:12.4.1-runtime-ubuntu22.04}
        COLMAP_REF: ${COLMAP_REF:-main}
        BRUSH_REF: ${BRUSH_REF:-main}
        SUPER_SPLAT_REF: ${SUPER_SPLAT_REF:-main}
        CUDA_ARCH: ${CUDA_ARCH:-89}
        NEXT_PUBLIC_GAUSSIAN_DEMO: ${NEXT_PUBLIC_GAUSSIAN_DEMO:-false}
    environment:
      GAUSSIAN_DATA_ROOT: /app/runtime/data
      GAUSSIAN_MAX_WORKERS: ${GAUSSIAN_MAX_WORKERS:-1}
      NVIDIA_VISIBLE_DEVICES: all
      # Brush uses headless Vulkan; graphics is required even without a display.
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
      # Do not let Brush silently select its CPU backend when a discrete GPU is available.
      CUBECL_WGPU_DEFAULT_DEVICE: "${CUBECL_WGPU_DEFAULT_DEVICE:-DiscreteGpu(0)}"
      SPLAT_TRANSFORM_BIN: /usr/local/bin/splat-transform
    volumes:
      - gaussian-data:/app/runtime/data
    expose:
      - "4177"
    runtime: nvidia
    restart: unless-stopped

  nginx:
    image: harbor.djicorp.com/es310/public/nginx:1.26.1
    depends_on:
      - backend
    ports:
      - "${HTTPS_PORT:-8080}:443"
    volumes:
      - ${GAUSSIAN_TLS_DIR:-../runtime/tls}:/etc/nginx/tls:ro
      - ./nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  gaussian-data:
